<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-agent</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; height: 100vh; }
    #wall-bg {
      position: fixed;
      left: 0; top: 0; right: 0; bottom: 0;
      z-index: -1;
      background: #fff center/cover no-repeat fixed;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    body.wall-on #sidebar,
    body.wall-on .side-block {
      background: rgba(238, 241, 246, 0.62);
    }
    body.wall-on #chat-head {
      background: rgba(255, 255, 255, 0.45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    body.wall-on .msg {
      background: rgba(255, 255, 255, 0.62);
      border-radius: 12px;
      padding: 8px 12px;
      width: fit-content;
      max-width: 85%;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      white-space: pre-wrap;
    }
    body.wall-on .msg.user { background: rgba(214, 228, 255, 0.66); }
    body.wall-on .msg.status {
      background: transparent;
      font-style: italic;
      color: #666;
      width: 100%;
      text-align: center;
    }
    #app { display: flex; height: 100vh; }

    #sidebar {
      width: 240px;
      flex: 0 0 240px;
      background: #eef1f6;
      border-right: 1px solid #d9dee7;
      display: flex;
      flex-direction: column;
    }
    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
    }
    .side-head strong { font-size: 16px; }
    #new-btn {
      border: none;
      background: #0b57d0;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    #session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    #state-body { overflow-y: auto; padding: 4px 10px 12px; max-height: 42%; }
    .side-block { border-top: 1px solid #d9dee7; background: #e6ebf3; }
    .side-title {
      padding: 10px 14px 4px;
      font-size: 13px;
      font-weight: 600;
      color: #5b6472;
    }
    .state-section {
      font-size: 11px;
      color: #8a93a3;
      margin: 8px 0 3px;
      font-weight: 600;
    }
    .state-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #3a4049;
      padding: 3px 4px;
      border-radius: 5px;
    }
    .state-item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .state-item small { color: #98a1af; margin-left: 4px; }
    .state-empty { font-size: 12px; color: #98a1af; padding: 2px 4px; }
    .summary-box {
      font-size: 12px;
      color: #4a5361;
      background: #f4f7fb;
      border: 1px solid #dfe6ee;
      border-radius: 6px;
      padding: 6px 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .state-del {
      border: none;
      background: transparent;
      color: #aab2bf;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 5px;
    }
    .state-del:hover { color: #d93025; }
    .session-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .session-item:hover { background: #dfe5ee; }
    .session-item.active { background: #d3e2ff; }
    .session-text { flex: 1; min-width: 0; }
    .session-title {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-meta { font-size: 11px; color: #8a93a3; margin-top: 2px; }
    .del-btn {
      border: none;
      background: transparent;
      color: #b0b7c2;
      cursor: pointer;
      font-size: 14px;
      visibility: hidden;
      padding: 2px 4px;
    }
    .session-item:hover .del-btn { visibility: visible; }
    .del-btn:hover { color: #d93025; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #e4e7ec;
      position: relative;
      z-index: 20;
    }
    #chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    #persona-select {
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid #ccd3dd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .wall-wrap { position: relative; }
    .wall-btn {
      border: 1px solid #ccd3dd;
      background: #fff;
      color: #5b6472;
      border-radius: 6px;
      font-size: 13px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .wall-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 200;
      background: #fff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      padding: 4px;
      z-index: 30;
      min-width: 130px;
    }
    .wall-menu.hidden { display: none; }
    .wall-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      color: #3a4049;
    }
    .wall-menu button:hover { background: #eef1f6; }
    .wall-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #5b6472;
      border-top: 1px solid #eef1f6;
    }
    .wall-opt input[type="range"] { width: 110px; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 0;
    }
    .msg { margin: 10px 0; }
    .user { color: #0b57d0; }
    .assistant { white-space: pre-wrap; }
    .status { color: #888; font-size: 12px; font-style: italic; }
    #input-row {
      display: flex;
      gap: 8px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 16px 16px;
    }
    #input {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccd3dd;
      border-radius: 8px;
    }
    button[type=button] { padding: 10px 18px; cursor: pointer; }
    #send { border: none; background: #0b57d0; color: #fff; border-radius: 8px; }
    #send:disabled { opacity: 0.55; cursor: not-allowed; }
    .empty-hint { color: #98a1af; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <div id="wall-bg"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <strong>mini-agent</strong>
        <button id="new-btn" title="新建会话">＋</button>
      </div>
      <div id="session-list"></div>
      <div class="side-block">
        <div class="side-title">记忆 / 状态</div>
        <div id="state-body"><div class="state-empty">选择会话后显示</div></div>
      </div>
    </aside>
    <main>
      <header id="chat-head">
        <span id="chat-title">新对话</span>
        <div class="wall-wrap">
          <button id="wall-btn" class="wall-btn" title="聊天壁纸">🖼 壁纸</button>
          <div id="wall-menu" class="wall-menu hidden">
            <button data-act="char">角色（cliko）</button>
            <button data-act="upload">上传图片…</button>
            <button data-act="clear">清除壁纸</button>
            <div class="wall-opt">
              <label for="wall-opacity">不透明度</label>
              <input id="wall-opacity" type="range" min="10" max="100" value="70">
              <span id="wall-opacity-val">70%</span>
            </div>
            <label class="wall-opt" for="wall-full">
              <span>铺满全窗口（含顶部栏）</span>
              <input id="wall-full" type="checkbox" checked>
            </label>
          </div>
        </div>
        <select id="persona-select" title="切换人设"></select>
      </header>
      <input id="wall-file" type="file" accept="image/*" hidden>
      <div id="log"><div class="empty-hint">点击左侧会话，或点 ＋ 开始新对话</div></div>
      <div id="input-row">
        <input id="input" placeholder="试试：帮我算 (12+8)*3，然后记个便签" autocomplete="off">
        <button id="send">发送</button>
      </div>
    </main>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newBtn = document.getElementById("new-btn");
    const listBox = document.getElementById("session-list");
    const chatTitle = document.getElementById("chat-title");
    const personaSelect = document.getElementById("persona-select");
    const appEl = document.getElementById("app");
    const state = { currentId: null, busy: false, speaker: "cliko", wallMode: "" };
    const wallBtn = document.getElementById("wall-btn");
    const wallMenu = document.getElementById("wall-menu");
    const wallFile = document.getElementById("wall-file");
    const wallBg = document.getElementById("wall-bg");
    const wallOpacity = document.getElementById("wall-opacity");
    const wallOpacityVal = document.getElementById("wall-opacity-val");
    const wallFull = document.getElementById("wall-full");

    function updateWallUI() {
      const op = Number(wallOpacity.value);
      wallBg.style.opacity = op / 100;
      wallOpacityVal.textContent = op + "%";
      const full = wallFull.checked;
      if (full) {
        wallBg.style.top = "0";
        wallBg.style.bottom = "0";
        document.body.classList.remove("wall-partial");
      } else {
        wallBg.style.top = "53px";   // 不含顶部选项栏
        wallBg.style.bottom = "70px"; // 不含输入行
        document.body.classList.add("wall-partial");
      }
    }

    function persistWall() {
      fetch("/api/wallpaper/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mode: state.wallMode,
          opacity: Number(wallOpacity.value),
          full: wallFull.checked
        })
      }).catch(() => {});
    }

    function loadWallSettings() {
      updateWallUI();
    }
    wallOpacity.addEventListener("input", () => { updateWallUI(); persistWall(); });
    wallFull.addEventListener("change", () => { updateWallUI(); persistWall(); });

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }

    function applyWallpaper(url) {
      wallBg.style.backgroundImage = "url('" + url + "')";
      wallBg.style.backgroundColor = "#fff";
      document.body.classList.add("wall-on");
      state.wallUrl = url;
      updateWallUI();
    }

    function clearWallpaperUI() {
      wallBg.style.backgroundImage = "none";
      wallBg.style.opacity = "1";
      document.body.classList.remove("wall-on", "wall-partial");
      state.wallUrl = null;
      state.wallMode = "";
      persistWall();
    }

    async function applyCharacterWallpaper() {
      try {
        const res = await fetch("/api/skin/current");
        if (!res.ok) throw new Error("HTTP " + res.status);
        if (state.wallUrl) URL.revokeObjectURL(state.wallUrl);
        state.wallUrl = URL.createObjectURL(await res.blob());
        applyWallpaper(state.wallUrl);
        state.wallMode = "character";
        persistWall();
      } catch (e) {
        alert("读取角色壁纸失败：" + e.message);
      }
    }

    async function initWallpaper() {
      try {
        const s = await api("/api/wallpaper/settings");
        wallOpacity.value = s.opacity;
        wallFull.checked = s.full;
        if (s.mode === "character") {
          await applyCharacterWallpaper();
        } else if (s.mode === "custom" && s.custom_url) {
          state.wallMode = "custom";
          applyWallpaper(s.custom_url);
        } else {
          state.wallMode = "";
          updateWallUI();
        }
      } catch (e) {
        loadWallSettings();
      }
    }

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function fmtTime(ts) {
      if (!ts) return "";
      const d = new Date(ts * 1000);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      return sameDay ? time : d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" }) + " " + time;
    }

    function shortName(label) {
      return String(label || "").split("（")[0].trim() || label;
    }

    function titleOf(s) {
      const t = (s.title || "").replace(/\s+/g, " ").trim();
      return t ? t.slice(0, 18) : "新对话";
    }

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = (role === "user" ? "你：" : state.speaker + "：") + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function renderState() {
      if (!state.currentId) return;
      try {
        const st = await api("/api/state?session_id=" + encodeURIComponent(state.currentId));
        const body = document.getElementById("state-body");
        let html = "";
        html += '<div class="state-section">滚动摘要（L2）</div>';
        html += st.summary
          ? '<div class="summary-box">' + esc(st.summary) + "</div>"
          : '<div class="state-empty">暂无，多聊几句会自动生成</div>';
        html += '<div class="state-section">便签（L3）</div>';
        if (!st.notes.length) html += '<div class="state-empty">还没有便签</div>';
        for (const n of st.notes) {
          const tag = n.tag ? "[" + n.tag + "] " : "";
          html += '<div class="state-item"><span>' + esc(tag + n.content) + "</span>"
            + '<button class="state-del" data-type="note" data-id="' + n.id + '" title="删除便签">✕</button></div>';
        }
        html += '<div class="state-section">定时提醒</div>';
        if (!st.reminders.length) html += '<div class="state-empty">暂无，可以跟 cliko 说“每天 9 点提醒我…”</div>';
        for (const r of st.reminders) {
          html += '<div class="state-item"><span>' + esc(r.content)
            + "<small> · " + esc(r.cron) + "</small></span>"
            + '<button class="state-del" data-id="' + r.id + '" title="取消提醒">✕</button></div>';
        }
        body.innerHTML = html;
        body.querySelectorAll(".state-del").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (btn.dataset.type === "note") removeNote(Number(btn.dataset.id));
            else removeReminder(Number(btn.dataset.id));
          });
        });
      } catch (e) { /* 网络抖动忽略 */ }
    }

    async function removeReminder(id) {
      try {
        await api("/api/reminders/" + id, { method: "DELETE" });
        await renderState();
      } catch (e) { alert("取消失败：" + e.message); }
    }

    async function removeNote(id) {
      try {
        await api("/api/notes/" + id, { method: "DELETE" });
        await renderState();
      } catch (e) { alert("删除便签失败：" + e.message); }
    }

    async function renderSessions() {
      const list = await api("/api/sessions");
      if (list.length === 0) {
        const created = await api("/api/sessions", { method: "POST" });
        list.push({ id: created.id, created_at: Date.now() / 1000, title: "", message_count: 0 });
      }
      listBox.innerHTML = "";
      for (const s of list) {
        const item = document.createElement("div");
        item.className = "session-item" + (s.id === state.currentId ? " active" : "");

        const text = document.createElement("div");
        text.className = "session-text";
        const title = document.createElement("div");
        title.className = "session-title";
        title.textContent = titleOf(s);
        const meta = document.createElement("div");
        meta.className = "session-meta";
        meta.textContent = (s.message_count || 0) + " 条 · " + fmtTime(s.last_ts || s.created_at);
        text.append(title, meta);

        const del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "✕";
        del.title = "删除会话";
        del.addEventListener("click", (e) => { e.stopPropagation(); removeSession(s.id); });

        item.append(text, del);
        item.addEventListener("click", () => switchTo(s.id));
        listBox.appendChild(item);
      }
      const current = list.find((s) => s.id === state.currentId) || list[0] || null;
      state.currentId = current ? current.id : null;
      chatTitle.textContent = current ? titleOf(current) : "新对话";
      return list;
    }

    async function initPersona() {
      const [list, cur] = await Promise.all([
        api("/api/personas"),
        api("/api/persona")
      ]);
      personaSelect.innerHTML = "";
      for (const p of list) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        personaSelect.appendChild(opt);
      }
      personaSelect.value = cur.persona;
      state.speaker = shortName(personaSelect.selectedOptions[0].textContent);
      document.title = "mini-agent · " + (personaSelect.selectedOptions[0] || {}).textContent || "mini-agent";
      personaSelect.addEventListener("change", async () => {
        const pid = personaSelect.value;
        await api("/api/persona", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ persona: pid })
        });
        const label = personaSelect.selectedOptions[0].textContent;
        state.speaker = shortName(label);
        document.title = "mini-agent · " + label;
      });
    }

    async function showMessages(sessionId) {
      log.innerHTML = "";
      const rows = await api(`/api/sessions/${encodeURIComponent(sessionId)}/messages`);
      if (rows.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "开始聊天吧";
        log.appendChild(hint);
        return;
      }
      for (const row of rows) append(row.role, row.content);
    }

    async function switchTo(sessionId) {
      state.currentId = sessionId;
      await showMessages(sessionId);
      await renderSessions();
      await renderState();
    }

    async function removeSession(sessionId) {
      const wasCurrent = sessionId === state.currentId;
      if (!confirm("删除这个会话？其中的消息和摘要会一并删除（便签保留）。")) return;
      await api(`/api/sessions/${encodeURIComponent(sessionId)}`, { method: "DELETE" });
      if (wasCurrent) {
        state.currentId = null; // renderSessions 会归一化到列表第一个（没有就自动新建）
        await renderSessions();
        await showMessages(state.currentId);
      } else {
        await renderSessions();
      }
    }

    async function newChat() {
      const created = await api("/api/sessions", { method: "POST" });
      state.currentId = created.id;
      await showMessages(created.id);
      await renderSessions();
      await renderState();
      input.focus();
    }

    async function send() {
      if (state.busy) return;
      if (!state.currentId) {
        const created = await api("/api/sessions", { method: "POST" });
        state.currentId = created.id;
        await renderSessions();
      }
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      append("user", message);
      const agentDiv = append("assistant", "");
      const statusDiv = document.createElement("div");
      statusDiv.className = "msg status";
      statusDiv.textContent = "正在思考…";
      log.appendChild(statusDiv);
      state.busy = true;
      sendBtn.disabled = true;
      let full = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: state.currentId, message: message })
        });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf("\n\n")) >= 0) {
            const frame = buf.slice(0, sep);
            buf = buf.slice(sep + 2);
            for (const line of frame.split("\n")) {
              if (!line.startsWith("data: ")) continue;
              const ev = JSON.parse(line.slice(6));
              if (ev.type === "text") {
                full += ev.text;
                agentDiv.textContent = state.speaker + "：" + full;
                statusDiv.remove();
              } else if (ev.type === "tool") {
                statusDiv.textContent = "🔧 正在调用工具：" + ev.name + "…";
              } else if (ev.type === "error") {
                agentDiv.textContent = state.speaker + "：出错了 " + ev.message;
                statusDiv.remove();
              }
            }
          }
          log.scrollTop = log.scrollHeight;
        }
      } catch (e) {
        agentDiv.textContent = state.speaker + "：请求失败 " + e;
        statusDiv.remove();
      } finally {
        state.busy = false;
        sendBtn.disabled = false;
        await renderSessions(); // 刷新标题与排序，但不重载消息流
        await renderState();
        input.focus();
      }
    }

    async function pollReminders() {
      // 服务器到点返回到期提醒——agent 会自己动，不需要用户先发消息
      try {
        const due = await api("/api/reminders/due");
        for (const r of due) {
          const key = r.id + "-" + Math.floor(Date.now() / 60000);
          if (window.__reminderSeen && window.__reminderSeen.has(key)) continue;
          if (!window.__reminderSeen) window.__reminderSeen = new Set();
          window.__reminderSeen.add(key);
          if (window.__reminderSeen.size > 300) window.__reminderSeen.clear();
          append("assistant", "[⏰ 主动提醒] " + r.content);
        }
        await renderState();
      } catch (e) { /* 网络抖动忽略，下轮再试 */ }
    }

    newBtn.addEventListener("click", newChat);
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    setInterval(pollReminders, 15000);

    wallBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      wallMenu.classList.toggle("hidden");
    });
    wallMenu.addEventListener("click", async (e) => {
      const act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      wallMenu.classList.add("hidden");
      if (act === "char") await applyCharacterWallpaper();
      else if (act === "upload") wallFile.click();
      else if (act === "clear") clearWallpaperUI();
    });
    wallFile.addEventListener("change", async () => {
      const file = wallFile.files && wallFile.files[0];
      if (!file) return;
      try {
        const fd = new FormData();
        fd.append("file", file);
        const res = await fetch("/api/wallpaper/custom", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "HTTP " + res.status);
        if (state.wallUrl) URL.revokeObjectURL(state.wallUrl);
        state.wallUrl = null;
        state.wallMode = "custom";
        applyWallpaper(data.url);
        persistWall();
      } catch (e) {
        alert("上传壁纸失败：" + e.message);
      }
      wallFile.value = "";
    });
    document.addEventListener("click", () => wallMenu.classList.add("hidden"));

    // 启动：建出/选中第一个会话并回显历史
    (async function init() {
      await renderSessions();
      if (state.currentId) {
        await showMessages(state.currentId);
        await renderState();
      }
      await initPersona();
      await initWallpaper();
    })();
  </script>
</body>
</html>
