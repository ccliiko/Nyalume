<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-agent</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; }
    #log { background: #f7f7f8; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; }
    .msg { margin: 8px 0; }
    .user { color: #0b57d0; }
    .assistant { white-space: pre-wrap; }
    .status { color: #888; font-size: 12px; font-style: italic; }
    #input-row { display: flex; margin-top: 12px; gap: 8px; }
    #input { flex: 1; padding: 8px; font-size: 14px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>mini-agent</h1>
  <div id="log"></div>
  <div id="input-row">
    <input id="input" placeholder="试试：帮我算 (12+8)*3，然后记个便签">
    <button id="send">发送</button>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = (role === "user" ? "你：" : "Agent：") + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      append("user", message);
      const agentDiv = append("assistant", "");
      const statusDiv = document.createElement("div");
      statusDiv.className = "msg status";
      statusDiv.textContent = "正在思考…";
      log.appendChild(statusDiv);
      sendBtn.disabled = true;
      let full = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: "web-default", message: message })
        });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf("\n\n")) >= 0) {
            const frame = buf.slice(0, sep);
            buf = buf.slice(sep + 2);
            for (const line of frame.split("\n")) {
              if (!line.startsWith("data: ")) continue;
              const ev = JSON.parse(line.slice(6));
              if (ev.type === "text") {
                full += ev.text;
                agentDiv.textContent = "Agent：" + full;
                statusDiv.remove();
              } else if (ev.type === "tool") {
                statusDiv.textContent = "🔧 正在调用工具：" + ev.name + "…";
              } else if (ev.type === "error") {
                agentDiv.textContent = "Agent：出错了 " + ev.message;
                statusDiv.remove();
              }
            }
          }
          log.scrollTop = log.scrollHeight;
        }
      } catch (e) {
        agentDiv.textContent = "Agent：请求失败 " + e;
        statusDiv.remove();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
